name: Verificações de qualidade

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API — testes, cobertura, tipos e build
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: servidor/package-lock.json
      - name: Instalar dependências da API
        run: npm ci
        working-directory: servidor
      - name: Executar testes e cobertura da API
        run: npm run test:coverage
        working-directory: servidor
      - name: Verificar tipos da API
        run: npm run typecheck
        working-directory: servidor
      - name: Compilar a API
        run: npm run build
        working-directory: servidor

  aplicativo:
    name: App — testes, cobertura e tipos
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aplicativo/package-lock.json
      - name: Instalar dependências do app
        run: npm ci
        working-directory: aplicativo
      - name: Executar testes e cobertura do app
        run: npm run test:coverage
        working-directory: aplicativo
      - name: Verificar tipos do app
        run: npm run typecheck
        working-directory: aplicativo
