services:
  - type: web
    name: lembre-api
    runtime: node
    rootDir: servidor
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: lembre-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: test
      - key: DB_SSL
        value: "true"

  - type: web
    name: lembre-web
    runtime: static
    rootDir: aplicativo
    buildCommand: npm ci --include=dev && npm run build:web
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: EXPO_PUBLIC_API_URL
        fromService:
          type: web
          name: lembre-api
          envVarKey: RENDER_EXTERNAL_URL
