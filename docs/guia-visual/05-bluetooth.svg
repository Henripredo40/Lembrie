  <text x="72" y="74" font-size="16" font-weight="800" letter-spacing="3" fill="#16796d">LEMBRIÊ  /  GUIA VISUAL</text><text x="1204" y="74" text-anchor="end" font-size="14" font-weight="700" fill="#71827e">06 / 09</text>
