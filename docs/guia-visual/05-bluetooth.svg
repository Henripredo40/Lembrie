  <text x="650" y="262" font-size="43" fill="#153c36" font-weight="750">Associe um chaveiro</text><text x="650" y="312.74" font-size="43" fill="#153c36" font-weight="750">a um objeto.</text>
  <text x="650" y="374" font-size="18" fill="#5d706b">Veja como usar esta área:</text>
  <rect x="650" y="410" width="558" height="242" rx="24" fill="#fff" stroke="#e1ebe7"/>
  <circle cx="683" cy="450" r="13" fill="#e8f5f1"/><text x="683" y="455" text-anchor="middle" font-size="12" font-weight="800" fill="#16796d">1</text><text x="710" y="447" font-size="16" font-weight="750" fill="#203b36">Escolher objeto</text><text x="710" y="467" font-size="13" fill="#70807c">Selecione qual item será associado.</text><circle cx="683" cy="498" r="13" fill="#e8f5f1"/><text x="683" y="503" text-anchor="middle" font-size="12" font-weight="800" fill="#16796d">2</text><text x="710" y="495" font-size="16" font-weight="750" fill="#203b36">Buscar dispositivos</text><text x="710" y="515" font-size="13" fill="#70807c">Ative o Bluetooth e coloque o chaveiro em modo de …</text><circle cx="683" cy="546" r="13" fill="#e8f5f1"/><text x="683" y="551" text-anchor="middle" font-size="12" font-weight="800" fill="#16796d">3</text><text x="710" y="543" font-size="16" font-weight="750" fill="#203b36">Conectar</text><text x="710" y="563" font-size="13" fill="#70807c">Escolha o dispositivo encontrado e confirme.</text><circle cx="683" cy="594" r="13" fill="#e8f5f1"/><text x="683" y="599" text-anchor="middle" font-size="12" font-weight="800" fill="#16796d">4</text><text x="710" y="591" font-size="16" font-weight="750" fill="#203b36">Verificar status</text><text x="710" y="611" font-size="13" fill="#70807c">Consulte a conexão e o sinal na lista.</text>
  <rect x="650" y="678" width="558" height="150" rx="24" fill="#eaf5f1"/><text x="682" y="720" font-size="14" font-weight="800" letter-spacing="1.1" fill="#16796d">PRECISA DO CHAVEIRO FÍSICO</text><text x="682" y="757" font-size="16" fill="#39544e">A associação só funciona com um dispositivo BLE compatível ligado e próximo. A tela web pode não ter acesso à busca Bluetooth.</text><text x="682" y="790" font-size="13" fill="#6e827d">Ilustração explicativa · Os dados reais variam conforme a conta.</text>
  <text x="72" y="938" font-size="12" fill="#71827e">LEMBRIÊ  ·  Seus objetos, sua rotina e suas listas em um só lugar.</text><text x="1208" y="938" text-anchor="end" font-size="12" fill="#71827e">06 — Bluetooth</text>
  </svg>