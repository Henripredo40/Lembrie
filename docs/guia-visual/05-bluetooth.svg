  <text x="72" y="158" font-size="15" font-weight="800" letter-spacing="2" fill="#16796d">05 · BLUETOOTH</text>
  <text x="72" y="191" font-size="18" fill="#667975">Quando tiver um chaveiro compatível, conecte-o pelo app instalado no celular.</text>
  <g filter="url(#shadow)"><rect x="72" y="228" width="480" height="680" rx="36" fill="#fff"/><rect x="88" y="244" width="448" height="648" rx="25" fill="#f5f8f7"/></g>
  <rect x="88" y="244" width="448" height="77" rx="25" fill="#fff"/><path d="M88 296h448v25H88z" fill="#fff"/><rect x="106" y="262" width="42" height="42" rx="14" fill="#16796d"/><text x="127" y="291" text-anchor="middle" font-size="24" fill="#fff" font-weight="700">ᛒ</text><text x="162" y="278" font-size="11" font-weight="800" letter-spacing="2" fill="#16796d">LEMBRIÊ</text><text x="162" y="301" font-size="19" font-weight="750" fill="#17332f">Bluetooth</text><circle cx="502" cy="283" r="17" fill="#e8f5f1"/><text x="502" y="289" text-anchor="middle" font-size="17" fill="#16796d">↻</text>
