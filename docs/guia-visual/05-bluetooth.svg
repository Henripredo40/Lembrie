  <rect x="96" y="290" width="432" height="84" rx="18" fill="#fff" stroke="#e1ebe7"/><circle cx="124" cy="317" r="13" fill="#e8f5f1"/><text x="124" y="322" text-anchor="middle" font-size="14" fill="#16796d" font-weight="700">1</text><text x="150" y="320" font-size="17" fill="#18332f" font-weight="700">Escolher objeto</text><text x="150" y="346" font-size="13" fill="#667975">Selecione qual item será associado.</text><rect x="96" y="384" width="432" height="84" rx="18" fill="#fff" stroke="#e1ebe7"/><circle cx="124" cy="411" r="13" fill="#e8f5f1"/><text x="124" y="416" text-anchor="middle" font-size="14" fill="#16796d" font-weight="700">2</text><text x="150" y="414" font-size="17" fill="#18332f" font-weight="700">Buscar dispositivos</text><text x="150" y="440" font-size="13" fill="#667975">Ative o Bluetooth e coloque o chaveiro em modo de pareamento.</text><rect x="96" y="478" width="432" height="84" rx="18" fill="#fff" stroke="#e1ebe7"/><circle cx="124" cy="505" r="13" fill="#e8f5f1"/><text x="124" y="510" text-anchor="middle" font-size="14" fill="#16796d" font-weight="700">3</text><text x="150" y="508" font-size="17" fill="#18332f" font-weight="700">Conectar</text><text x="150" y="534" font-size="13" fill="#667975">Escolha o dispositivo encontrado e confirme.</text><rect x="96" y="572" width="432" height="84" rx="18" fill="#fff" stroke="#e1ebe7"/><circle cx="124" cy="599" r="13" fill="#e8f5f1"/><text x="124" y="604" text-anchor="middle" font-size="14" fill="#16796d" font-weight="700">4</text><text x="150" y="602" font-size="17" fill="#18332f" font-weight="700">Verificar status</text><text x="150" y="628" font-size="13" fill="#667975">Consulte a conexão e o sinal na lista.</text>
