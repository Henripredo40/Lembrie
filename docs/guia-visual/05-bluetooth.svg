<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960" role="img" aria-labelledby="title desc">
  <title id="title">05 · Bluetooth — Guia visual Lembriê</title><desc id="desc">Quando tiver um chaveiro compatível, conecte-o pelo app instalado no celular. Ilustração explicativa da tela Bluetooth.</desc>
