services:
  banco:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-lembre_root_local}
      MYSQL_DATABASE: ${DB_NAME:-chaveiro_antiperda}
      MYSQL_USER: ${DB_USER:-lembre}
      MYSQL_PASSWORD: ${DB_PASSWORD:-lembre_local}
    ports:
      - "${DB_FORWARD_PORT:-3306}:3306"
    volumes:
      - dados_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: banco
      DB_PORT: 3306
      DB_USER: ${DB_USER:-lembre}
      DB_PASSWORD: ${DB_PASSWORD:-lembre_local}
      DB_NAME: ${DB_NAME:-chaveiro_antiperda}
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-local}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081,http://localhost:19006}
    ports:
      - "${API_FORWARD_PORT:-3000}:3000"
    depends_on:
      banco:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  dados_mysql:
